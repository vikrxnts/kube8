
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: prod-hpa
  namespace: web

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prod

  minReplicas: 5
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
