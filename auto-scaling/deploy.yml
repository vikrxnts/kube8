
apiVersion: apps/v1
kind: Deployment

metadata:
  name: webhpa
  namespace: web
  annotations:
    kubernetes.io/change-cause: 'version 2'
  labels:
    role: webapp

spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      role: webapp
  template:
    metadata:
      labels:
        role: webapp
    spec:
      containers:
        - name: webserver
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: webmount
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests: 
              cpu: 50m
              memory: 50Mi
      volumes:
        - name: webmount
          configMap:
            name: app

---

apiVersion: v1
kind: Service

metadata:
  name: internal
  namespace: web
  labels:
    role: webapp

spec:
  type: ClusterIP
  ports:
    - targetPort: 80
      port: 80
