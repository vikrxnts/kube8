
apiVersion: apps/v1
kind: Deployment

metadata:
  name: webv2
  namespace: web
  annotations:
    kubernetes.io/change-cause: 'v2'

spec:
  replicas: 5
  selector:
    matchLabels:
      role: canary
  template:
    metadata:
      labels:
        role: canary
    spec:
      containers:
        - name: web
          image: nginx
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: webc
              mountPath: /usr/share/nginx/html
              readOnly: true

      volumes:
        - name: webc
          configMap:
            name: v2

--- 

apiVersion: v1
kind: Service

metadata:
  name: exposev2
  namespace: web

spec:
  type: ClusterIP
  ports:
    - targetPort: 80
      port: 80
  selector:
    role: canary

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: caning
  namespace: web
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
  labels:
    role: canary

spec:
  ingressClassName: nginx
  rules:
    - host: webapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exposev2  
                port:
                  number: 80
