

apiVersion: apps/v1
kind: Deployment

metadata:
  name: webv1
  namespace: web
  annotations:
    kubernetes.io/change-cause: 'v1'

spec:
  replicas: 5
  selector:
    matchLabels:
      role: webapp
  template:
    metadata:
      labels:
        role: webapp
    spec:
      containers:
        - name: web
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: webmount
              mountPath: /usr/share/nginx/html
              readOnly: true
       
      volumes:
        - name: webmount
          configMap:
            name: v1

---

apiVersion: v1
kind: Service

metadata:
  name: exposev1
  namespace: web
  
spec:
  type: ClusterIP
  ports:
    - targetPort: 80
      port: 80
  selector:
    role: webapp

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ingv1
  namespace: web
  labels:
    role: webapp

spec:
  ingressClassName: nginx
  rules:
    - host: webapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exposev1
                port:
                  number: 80
