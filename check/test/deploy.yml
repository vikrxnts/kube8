apiVersion: apps/v1
kind: Deployment

metadata:
  name: webhost
  namespace: default
  annotations:
    kubernetes.io/change-cause: "deploy version 4"
  
spec:
  replicas: 10
  strategy:
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: vikrxnt29/nginx:v4
          ports:
            - containerPort: 80
          env:
            - name: n1
              value: v1
          resources:
            limits:
              cpu: 50m
              memory: 500Mi
            requests:
              cpu: 20m
              memory: 50Mi


---

apiVersion: v1
kind: Service

metadata:
  name: expose
  labels:
    app: web

spec:
  type: NodePort
  ports:
    - nodePort: 32000
      port: 80
      targetPort: 80
  selector:
    app: web
