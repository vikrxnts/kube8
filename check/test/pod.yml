apiVersion: v1
kind: Pod

metadata:
  name: check
  namespace: web
  labels:
    app: web

spec:
  containers: 
    - name: web1
      image: nginx
      ports:
        - containerPort: 80
      resources:
        limits:
          cpu: 100m 
          memory: 150Mi
        requests:
          cpu: 10m
          memory: 10Mi
