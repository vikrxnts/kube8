apiVersion: v1
kind: ResourceQuota

metadata:
  name: rq
  namespace: web

spec:
  hard:
    pods: 5
    limits.cpu: 500m
    limits.memory: 500Mi
    requests.cpu: 20m
    requests.memory: 20Mi


---

apiVersion: v1
kind: LimitRange

metadata:
  name: limit
  namespace: web

spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 100Mi
      defaultRequest:
        cpu: 10m
        memory: 10Mi
