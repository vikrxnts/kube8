apiVersion: v1
kind: Secret
metadata:
  name: dbcred
  namespace: web
type: Opaque
data:
  MARIADB_DATABASE: bXlkYg==
  MARIADB_USER: ZGJ1c2Vy
  MARIADB_PASSWORD: YWRtaW4xMjM=
  MARIADB_ROOT_PASSWORD: cm9vdDEyMw==

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modpage
  namespace: web
data:
  index.html: |
    <html>
    <body>
      <h1>Welcome to Nginx</h1>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webdeployment
  namespace: web
  labels:
    role: webapp
spec:
  replicas: 10
  selector:
    matchLabels:
      role: webapp
  template:
    metadata:
      labels:
        role: webapp
    spec:
      containers:
        - name: webserver
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: webmount
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: webmount
          configMap:
            name: modpage

---
apiVersion: v1
kind: Service
metadata:
  name: expose
  namespace: web
spec:
  type: NodePort
  selector:
    role: webapp
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32002

---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: web
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: web
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4.7
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: dbcred
          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mariadb-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
