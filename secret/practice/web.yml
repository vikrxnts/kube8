

apiVersion: v1
kind: Pod

metadata:
  name: web
  namespace: web
  labels:
    app: web

spec:
  containers:
    - name: webserver
      image: nginx
      ports:
        - containerPort: 3306
      volumeMounts:
        - name: webmount
          mountPath: /usr/share/nginx/html
          readOnly: true
  volumes:
    - name: webmount
      secret:
        secretName: webpage 
