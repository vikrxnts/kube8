
apiVersion: v1
kind: Secret

data:
  MARIADB_DATABASE: bXlkYg==
  MARIADB_USER: ZGJ1c2Vy
  MARIADB_PASSWORD: dXNlcjEyMw==
  MARIADB_ROOT_PASSWORD: cm9vdDEyMw==

metadata:
  name: dbcred
  namespace: web

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: webhosting
  namespace: web
  annotations:
    kubernetes.io/change-cause: 'version 1'
  labels:
    role: webapp

spec:
  replicas: 10
  selector:
    matchLabels:
      role: webapp
  strategy:
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        role: webapp
    spec:
      containers:
        - name: web
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 10m
              memory: 10Mi
          volumeMounts:
            - name: webmount
              mountPath: /usr/share/nginx/html
              readOnly: True
        - name: db
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: dbcred
          volumeMounts:
            - name: dbmount
              mountPath: /var/lib/mysql

      volumes:
        - name: webmount
          configMap:
            name: webpage 
        - name: dbmount
          emptyDir: {}

---

apiVersion: v1
kind: Service

metadata:
  name: expose
  namespace: web

spec:
  type: NodePort
  ports:
    - nodePort: 32002
      port: 80
      targetPort: 80
  selector:
    role: webapp

---

apiVersion: v1
kind: Service

metadata:
  name: insider
  namespace: web

spec:
  type: ClusterIP
  ports:
    - targetPort: 3306
      port: 3306
  selector: 
    role: webapp
