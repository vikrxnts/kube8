
apiVersion: apps/v1
kind: Deployment

metadata:
  name: prod-web
  namespace: web
  annotations:
    kubernetes.io/change-cause: 'prod version v1'
  
spec:
  replicas: 5
  selector:
    matchLabels:  
      role: prodv1
  strategy:
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        role: prodv1
    spec:
      containers:
        - name: web
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: webmount
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            limits:
              cpu: 1000m
              memory: 1000Mi
            requests:
              cpu: 50m
              memory: 50Mi
        
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            timeoutSeconds: 5
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          
      volumes:
        - name: webmount
          configMap:
            name: v1

---

apiVersion: v1
kind: Service

metadata:
  name: prod-service
  namespace: web

spec:
  type: ClusterIP
  ports:
    - targetPort: 80
      port: 80
  selector:
    role: prodv1

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: prod-ingress
  namespace: web

spec:
  ingressClassName: nginx
  rules:
    - host: webapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-service
                port:
                  number: 80  