apiVersion: apps/v1
kind: Deployment

metadata:
  name: webhost
  namespace: web
  annotations:
    kubernetes.io/change-cause: 'deploy version 1'
  labels:
    app: web

spec:
  replicas: 10
  selector:
    matchLabels:
      app: web
  strategy:
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - name: webmount
              mountPath: "/usr/share/nginx/html/"
              readOnly: true
          env:
            - name: n1
              value: v1
      volumes:
        - name: webmount
          configMap:
            name: vers1

---

apiVersion: v1
kind: Service

metadata:
  name: expose
  namespace: web
  labels:
    app: web

spec:
  type: NodePort
  ports:
    - nodePort: 32002
      port: 80
      targetPort: 80
  selector:
    app: web

