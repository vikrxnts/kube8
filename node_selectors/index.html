<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Welcome</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Segoe UI,sans-serif;
    background:#0b1120;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

body::before{
    content:'';
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, #00d4ff33, transparent 35%),
        radial-gradient(circle at 80% 80%, #7c3aed44, transparent 35%);
}

.container{
    position:relative;
    text-align:center;
    max-width:900px;
    padding:40px;
}

.tag{
    display:inline-block;
    padding:8px 18px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:999px;
    margin-bottom:25px;
    color:#94a3b8;
    backdrop-filter:blur(10px);
}

h1{
    font-size:5rem;
    line-height:1;
    margin-bottom:20px;
}

.gradient{
    background:linear-gradient(
        90deg,
        #00d4ff,
        #7c3aed
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    color:#94a3b8;
    font-size:1.3rem;
    margin-bottom:40px;
}

.card{
    display:inline-block;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(12px);
    padding:20px 30px;
    border-radius:20px;
}

.time{
    font-size:1.5rem;
    font-weight:600;
}

.footer{
    margin-top:40px;
    color:#64748b;
    font-size:.95rem;
}
</style>
</head>

<body>

<div class="container">

    <div class="tag">
        Powered by NGINX 🚀
    </div>

    <h1>
        <span class="gradient">Hello kube8</span>
    </h1>

    <p class="subtitle">
        Your container is running successfully.
    </p>

    <div class="card">
        <div class="time" id="time"></div>
    </div>

    <div class="footer">
        Container deployed successfully ✨
    </div>

</div>

<script>
function updateTime() {
    document.getElementById('time').innerHTML =
        new Date().toLocaleString();
}

updateTime();
setInterval(updateTime,1000);
</script>

</body>
</html>
