apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  containers:
  - name: nginx
    image: nginx:latest

    readinessProbe:
      httpGet:
        path: /data
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 2

    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 5
