
apiVersion: v1
kind: Pod

metadata:
  name: pod1
  namespace: web
  labels:
    role: webapp

spec:
  containers: 
    - name: webserver
      image: nginx:1.27
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 30
        periodSeconds: 2
        timeoutSeconds: 5
        successThreshold: 3
        failureThreshold: 3

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 30
        successThreshold: 1
        failureThreshold: 2


