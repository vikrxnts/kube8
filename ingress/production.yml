apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  namespace: production
  annotations:
    # 1. Controller Routing
    kubernetes.io/ingress.class: "nginx"
    
    # 2. Automated TLS Certificate (cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # 3. Security & HTTPS Enforcement
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-min-version: "TLSv1.2"
    
    # 4. Request Limits & Timeouts
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"          # Max payload size
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"      # Connection timeout (s)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"         # Read timeout (s)
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"         # Send timeout (s)

    # 5. Rate Limiting (DDoS / Abusive Traffic Protection)
    nginx.ingress.kubernetes.io/limit-rps: "20"                 # Max 20 requests/sec per IP
    nginx.ingress.kubernetes.io/limit-connections: "10"         # Max 10 connections per IP

    # 6. Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.yourdomain.com
      secretName: app-yourdomain-tls  # cert-manager populates this automatically
  rules:
    - host: app.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-app-service
                port:
                  number: 80
