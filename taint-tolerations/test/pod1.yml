
apiVersion: v1
kind: Pod

metadata:
  name: pod1
  namespace: web
  labels:
    role: taints

spec:
  containers:
    - name: web
      image: nginx
      imagePullPolicy: Never
      ports:
        - containerPort: 80
  tolerations:
    - key: "mysize"
      operator: "Equal"
      value: "small"
      effect: "NoSchedule"
