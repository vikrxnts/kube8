
apiVersion: apps/v1
kind: Deployment

metadata:
  name: destination
  namespace: web
  annotations:
    kubernetes.io/change-cause: 'source deployment'
  labels:
    app: web

spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  strategy:
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 82

