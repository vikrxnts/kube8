

apiVersion: v1
kind: Pod

metadata:
  name: pod
  namespace: web
  labels:
    role: dns

spec:
  containers:
    - name: web
      image: nginx:1.27
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      volumeMounts:
        - name: webmount
          mountPath: /usr/share/nginx/html
          readOnly: true
  volumes:
    - name: webmount
      configMap:
        name: v1

---

apiVersion: v1
kind: Service

metadata:
  name: dnscip
  namespace: web

spec:
  type: ClusterIP
  ports:
    - targetPort: 80
      port: 80
  selector:
    role: dns
