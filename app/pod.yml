
apiVersion: v1
kind: Pod

metadata:
  name: web
  namespace: web
  labels:
    role: python

spec:
  containers:
    - image: python:3.12
      name: python
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8000
      command: ["python"]
      args: ["/data/app.py"] 
      volumeMounts:
        - name: appmount
          mountPath: /data/

  volumes:
    - name: appmount
      configMap:
        name: app
